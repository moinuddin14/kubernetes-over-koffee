name: Issue Validator

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Validate issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const requiredFields = ['description'];

            // SIG labels we accept (must match labels.yml names)
            const sigLabels = [
              'sig/node','sig/network','sig/storage','sig/scalability','sig/api-machinery','sig/cli','sig/auth','sig/architecture','sig/instrumentation','sig/docs'
            ];

            function hasSigLabel(labels){
              return labels.some(l=> sigLabels.includes(l.name));
            }

            const labels = issue.labels || [];
            const body = issue.body || '';

            // Try to extract the Type field from the form body
            const typeMatch = body.match(/\n?Type:\s*(.+)/i) || body.match(/\n?type:\s*(.+)/i);
            let selectedType = null;
            if(typeMatch && typeMatch[1]){
              selectedType = typeMatch[1].trim().toLowerCase();
            }

            // Try to extract priority field (expecting values like 'priority/low')
            const priorityMatch = body.match(/\n?Priority:\s*(.+)/i);
            let selectedPriority = null;
            if(priorityMatch && priorityMatch[1]){
              selectedPriority = priorityMatch[1].trim().toLowerCase();
            }

            const missing = [];
            if(!body || body.trim().length < 20){
              missing.push('Description (please provide more detail)');
            }

            // If type is bug, require steps_to_reproduce field (simple heuristic)
            if(selectedType === 'bug'){
              const stepsMatch = body.match(/Steps to reproduce:\s*([\s\S]*?)\n\n/i) || body.match(/Steps to reproduce:\s*(.+)/i);
              if(!stepsMatch || !stepsMatch[1] || stepsMatch[1].trim().length < 10){
                missing.push('Steps to reproduce (please provide minimal reproducible steps for bugs)');
              }
            }

            // Try to extract the selected SIG from the issue body generated by the form
            const sigMatch = body.match(/Related SIG:\s*(.+)/i);
            let selectedSig = null;
            if(sigMatch && sigMatch[1]){
              selectedSig = sigMatch[1].trim();
            }

            // normalize selectedSig to sig/<name> if necessary
            if(selectedSig){
              // some forms may include the exact label (sig/node) or display name
              if(!selectedSig.startsWith('sig/')){
                selectedSig = 'sig/' + selectedSig.replace(/\s+/g,'-').toLowerCase();
              }
            }

            if(!hasSigLabel(labels) && !selectedSig){
              missing.push('SIG label (select one SIG label such as sig/node)');
            }

            if(missing.length > 0){
              const comment = `Thanks for opening this issue — I checked a few required fields and found:\n\n${missing.map(m=>`- ${m}`).join('\n')}\n\nPlease update the issue and add the missing information. Once complete, this check will run again.`;
              await github.rest.issues.createComment({owner, repo, issue_number: issue.number, body: comment});
              // add triage label
              await github.rest.issues.addLabels({owner, repo, issue_number: issue.number, labels: ['triage']}).catch(()=>{});
            } else {
              // If a type was selected, apply the corresponding label (bug/feature/task/question/event)
              const validTypes = ['bug','feature','task','question','event'];
              if(selectedType && validTypes.includes(selectedType) && !labels.some(l=> l.name === selectedType)){
                await github.rest.issues.addLabels({owner, repo, issue_number: issue.number, labels: [selectedType]}).catch(()=>{});
              }

              // If a priority was selected, apply the corresponding priority label (priority/*)
              const validPriorities = ['priority/low','priority/medium','priority/high','priority/critical'];
              if(selectedPriority && validPriorities.includes(selectedPriority) && !labels.some(l=> l.name === selectedPriority)){
                await github.rest.issues.addLabels({owner, repo, issue_number: issue.number, labels: [selectedPriority]}).catch(()=>{});
              }
              // If a selectedSig exists but the issue doesn't have the label yet, add it
              if(selectedSig && !labels.some(l=> l.name === selectedSig)){
                await github.rest.issues.addLabels({owner, repo, issue_number: issue.number, labels: [selectedSig]}).catch(()=>{});
              }
              // Assign to SIG owner if mapped, otherwise to repo owner
              let assignee = 'moinuddin14';
              try{
                const ownersFile = await github.rest.repos.getContent({owner, repo, path: '.github/SIG-owners.yml'});
                const content = Buffer.from(ownersFile.data.content, 'base64').toString();
                // parse simple YAML mapping
                const lines = content.split('\n');
                const map = {};
                for(const l of lines){
                  const m = l.match(/^(sig\/[^:]+):\s*(\S+)/);
                  if(m){ map[m[1].trim()] = m[2].trim(); }
                }
                if(selectedSig && map[selectedSig]){ assignee = map[selectedSig]; }
              }catch(e){ /* ignore and fallback to repo owner */ }
              await github.rest.issues.addAssignees({owner, repo, issue_number: issue.number, assignees: [assignee]}).catch(()=>{});
              // optionally add a ready label
              await github.rest.issues.addLabels({owner, repo, issue_number: issue.number, labels: ['help wanted']}).catch(()=>{});
            }
